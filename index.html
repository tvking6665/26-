<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>(주)전우정밀 공장동 전체 3D 관제</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #0b0d13; font-family: sans-serif; }
    #canvas-container { width: 100vw; height: 100vh; }
    #control-panel {
      position: absolute; top: 16px; left: 16px;
      background: rgba(18, 22, 32, 0.94); border: 1px solid #334155;
      border-radius: 8px; padding: 16px 20px; color: #f1f5f9; min-width: 320px;
      z-index: 100;
    }
    .btn { width: 100%; padding: 8px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; background: #334155; color: #fff; margin-top: 8px; }
    .btn:hover { background: #0284c7; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="control-panel">
    <h3 style="margin: 0 0 10px 0; color: #38bdf8;">공장동 전체 맵 관제</h3>
    <div id="status-text">설비 정상 가동 중</div>
    <button id="toggle-btn" class="btn">전 라인 일시정지</button>
  </div>

  <!-- 분할된 메인 스크립트 실행 -->
  <script type="module" src="./src/main.js"></script>
</body>
</html>
